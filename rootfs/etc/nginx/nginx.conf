# Main nginx configuration.
#
# Based on the nginx.conf shipped by the official nginx.org package for Ubuntu.
# The nginx.org package only includes /etc/nginx/conf.d/*.conf (there is no
# sites-enabled/ nor modules-enabled/), so every custom setting lives there:
#
#   conf.d/00-custom.conf   http-level settings (logging, real_ip, maps, cache, ssl ...)
#   conf.d/10-default.conf  default server block (PHP-FPM)
#
# The following values are replaced at container start by entrypoint.sh:
# user, worker_processes, worker_connections and keepalive_timeout.

user  www-data;
worker_processes  auto;

# pcre_jit must live in the main context (it used to be in modules-enabled/).
pcre_jit  on;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
    multi_accept        on;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile             on;
    tcp_nopush           on;
    types_hash_max_size  2048;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
